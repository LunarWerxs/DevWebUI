name: Release

# Tag a version (e.g. `git tag v0.1.0 && git push --tags`) to build the compiled binary on
# each OS and publish them to a GitHub Release. The single self-contained binary IS the product,
# so it ships as a first-class, CI-produced artifact rather than a local build.
#
# NOTE: arch labels below are nominal (ubuntu→x64, macos-latest→arm64). Adjust the matrix /
# `bun build --compile --target` in scripts/build.ts if you need additional arch variants.

on:
  push:
    tags: ["v*"]

  # Manual runs, so a commit or tag can be built without waiting on a webhook. Added 2026-08-06
  # during a GitHub Actions incident whose recovery plan was to THROTTLE webhook triggers: pushes
  # and tag pushes landed and produced no run at all. Dispatching on a TAG ref still satisfies the
  # `github.ref_type == 'tag'` gate on the publish job below, so it is a real release.
  # Dispatching on a BRANCH is not a supported path here: the validate job resolves the version
  # from the ref name, so it fails fast on the metadata check rather than publishing anything.
  # The gate is what guarantees the second half of that, whatever the ref turns out to be.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify version and changelog
        shell: bash
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          package_ver="$(node -p "require('./package.json').version")"
          if [ "$package_ver" != "$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${package_ver}"
            exit 1
          fi
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release section for ${GITHUB_REF_NAME}"
            exit 1
          fi

  build:
    name: build (${{ matrix.os }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile # root workspace install covers web/ too
      - run: bun run dist # scripts/build.ts — web build + `bun build --compile`
      - name: Smoke-test the actual release executable
        shell: bash
        run: |
          if [ -f dist/devwebui.exe ]; then bin=dist/devwebui.exe; else bin=dist/devwebui; fi
          bun run scripts/smoke-release.ts "$bin"
      - name: Package release assets
        shell: bash
        run: |
          mkdir -p out
          target="${{ matrix.target }}"
          if [ -f dist/devwebui.exe ]; then
            cp dist/devwebui.exe "out/devwebui-${target}.exe"
            (cd dist && 7z a -tzip "$GITHUB_WORKSPACE/out/devwebui-${target}.zip" devwebui.exe > /dev/null)
          elif [ -f dist/devwebui ]; then
            tar -C dist -czf "out/devwebui-${target}.tar.gz" devwebui
          else
            echo "::error::no compiled binary found in dist/"; ls -la dist || true; exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: devwebui-${{ matrix.target }}
          path: out/*

  release:
    name: publish release
    # Only a TAG publishes. A workflow_dispatch on a branch is a build + smoke validation
    # of the pipeline; dispatching on a tag ref still lands here and publishes for real.
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release notes from CHANGELOG
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            index($0, "## [" ver "]") == 1 { grab = 1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::CHANGELOG.md has no release section for ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "----- release notes -----"; cat RELEASE_NOTES.md
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Build checksums
        shell: bash
        run: |
          find artifacts -type f -print0 | sort -z | xargs -0 sha256sum |
            sed -E 's#  artifacts/[^/]+/#  #' > SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*
            SHA256SUMS.txt
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
